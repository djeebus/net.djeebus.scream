name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, so two quick merges can't race for the same version.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags

      # Installs the tools pinned in mise.toml: Java, Gradle, the Android SDK tools, Node and npm.
      - uses: jdx/mise-action@v2

      # Exact, locked versions from package.json / package-lock.json. When bumping semantic-release, keep
      # conventional-changelog-conventionalcommits on the major matching the writer its notes generator bundles.
      - name: Install release tooling
        run: mise x -- npm ci --ignore-scripts

      # Decides the next version from conventional commits. If nothing is releasable it does nothing;
      # otherwise it builds the APK (build-release.sh), tags, and publishes the release with the APK attached.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.SCREAM_KEYSTORE_BASE64 }}
          SCREAM_KEYSTORE_PASSWORD: ${{ secrets.SCREAM_KEYSTORE_PASSWORD }}
          SCREAM_KEY_ALIAS: ${{ secrets.SCREAM_KEY_ALIAS }}
          SCREAM_KEY_PASSWORD: ${{ secrets.SCREAM_KEY_PASSWORD }}
        run: mise x -- npx semantic-release
